version: '3.8'

services:
  # Example: Flat project structure
  fantasy-local:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PROJECT: LOCAL_FANTASY
    image: fantasy-builder-fe:local
    container_name: fantasy-local
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    profiles:
      - local

  # Example: Nested CLIENT/GAME structure
  fantasy-super-rugby:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PROJECT: FANTASY_PLATFORM/fantasy-super-rugby
    image: fantasy-builder-fe:super-rugby
    container_name: fantasy-super-rugby
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    profiles:
      - super-rugby

  # Development service with hot reload
  fantasy-builder-fe-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Change to the project you want to develop
        VITE_PROJECT: FANTASY_PLATFORM/fantasy-super-rugby
    image: fantasy-builder-fe:dev
    container_name: fantasy-builder-fe-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: yarn start
    restart: unless-stopped
    profiles:
      - dev
