name: Deploy

on:
  push:
    branches:
      - uat
      - main

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Determine environment based on branch
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'uat' }}
      url: ${{ steps.deploy-info.outputs.url }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run type check
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build project
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            npm run build -- --mode production
          else
            npm run build -- --mode development
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html" && \
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "public, max-age=3600" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Set deployment info
        id: deploy-info
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "url=https://your-production-domain.com" >> $GITHUB_OUTPUT
          else
            echo "url=https://your-uat-domain.com" >> $GITHUB_OUTPUT
          fi

      - name: Deployment complete
        run: |
          echo "✅ Environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'UAT' }}"
          echo "✅ S3 Bucket: ${{ vars.S3_BUCKET }}"
          echo "✅ CloudFront ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
